const favs=new Set(JSON.parse(localStorage.getItem("atl_favorites")||"[]"));
let map, infoWindow, AdvancedMarkerElement;
let markers = [], view = "places";

function showMapMessage(message) {
  const status = $("map-status");
  status.textContent = message;
  status.hidden = !message;
}

async function loadMap() {
  showMapMessage("Loading Google Maps…");
  try {
    const response = await fetch("/api/maps-config");
    if (!response.ok) throw new Error("Map configuration unavailable");
    const { key, mapId } = await response.json();
    if (!key || !mapId) throw new Error("Map configuration missing");

    await new Promise((resolve, reject) => {
      window.initAtlantaMap = resolve;
      window.gm_authFailure = () => {
        map = undefined;
        render();
        showMapMessage("Google Maps authorization failed.");
        reject(new Error("Google Maps authorization failed"));
      };
      const script = document.createElement("script");
      script.src = "https://maps.googleapis.com/maps/api/js?" + new URLSearchParams({
        key, loading: "async", callback: "initAtlantaMap", v: "weekly"
      });
      script.async = true;
      script.onerror = reject;
      document.head.appendChild(script);
    });

    const [{ Map, InfoWindow }, markerLibrary] = await Promise.all([
      google.maps.importLibrary("maps"),
      google.maps.importLibrary("marker")
    ]);
    AdvancedMarkerElement = markerLibrary.AdvancedMarkerElement;
    map = new Map($("map"), {
      center: { lat: 33.793, lng: -84.372 },
      zoom: 11,
      mapId,
      streetViewControl: false,
      mapTypeControl: false,
      fullscreenControl: false
    });
    infoWindow = new InfoWindow();
    showMapMessage("");
    render();
  } catch {
    showMapMessage("Google Maps is unavailable. Venue directions are still available.");
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function directionsUrl(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+p.neighborhood+" Atlanta GA")}

function options(id,values){values.sort().forEach(v=>{const o=document.createElement("option");o.textContent=v;o.value=v;$(id).appendChild(o)})}
options("category",[...new Set(places.map(p=>p.category))]);options("neighborhood",[...new Set(places.map(p=>p.neighborhood))]);
function toggle(id){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("atl_favorites",JSON.stringify([...favs]));render()}
function render(){
let q=$("search").value.toLowerCase(),cat=$("category").value,hood=$("neighborhood").value,status=$("status").value;
let arr=places.filter(p=>(view!=="favorites"||favs.has(p.id))&&(!cat||p.category===cat)&&(!hood||p.neighborhood===hood)&&(!status||p.status===status)&&[p.name,p.category,p.neighborhood,p.note].join(" ").toLowerCase().includes(q));
arr.sort((a,b)=>String(a[$("sort").value]).localeCompare(String(b[$("sort").value])));
$("total").textContent=places.length+" places";$("matchcount").textContent=arr.length+" matching venues · "+favs.size+" favorites";
$("results").replaceChildren();infoWindow?.close(); markers.forEach(marker => { marker.map = null; }); markers = [];
arr.forEach(p=>{
const d=document.createElement("div");d.className="venue";
d.innerHTML='<button class="star '+(favs.has(p.id)?"on":"")+'" aria-label="Toggle favorite">'+(favs.has(p.id)?"★":"☆")+'</button><h3>'+esc(p.name)+(p.status==="Upcoming"?'<span class="tag">Opening watch</span>':"")+'</h3><div class="meta">'+esc(p.category)+' · '+esc(p.neighborhood)+'</div>'+(p.note?'<div class="notes">'+esc(p.note)+'</div>':"");
d.querySelector("button").onclick=e=>{e.stopPropagation();toggle(p.id)};
if (map) {
  const position = { lat: p.lat, lng: p.lng };
  const dot = document.createElement("div");
  dot.className = "dot";
  dot.style.background = colors[p.category] || "#aaa";
  const marker = new AdvancedMarkerElement({
    map, position, title: p.name, gmpClickable: true,
    anchorLeft: "-50%", anchorTop: "-50%"
  });
  marker.append(dot);
  markers.push(marker);
  const openPopup = () => {
    infoWindow.setContent('<b>'+esc(p.name)+'</b><p>'+esc(p.category)+' · '+esc(p.neighborhood)+'</p><p>Approximate neighborhood pin</p><a target="_blank" rel="noopener" href="'+directionsUrl(p)+'">Find exact location / directions ↗</a>');
    infoWindow.open({ map, anchor: marker });
  };
  marker.addEventListener("gmp-click", openPopup);
  d.onclick = () => { map.setCenter(position); map.setZoom(14); openPopup(); };
}
const directions = document.createElement("a");
directions.href = directionsUrl(p);
directions.target = "_blank";
directions.rel = "noopener";
directions.textContent = "Directions ↗";
directions.addEventListener("click", event => event.stopPropagation());
d.appendChild(directions);
if (p.source) {
  const source = document.createElement("a");
  source.href = p.source;
  source.target = "_blank";
  source.rel = "noopener noreferrer";
  source.textContent = " · Eater review ↗";
  source.addEventListener("click", event => event.stopPropagation());
  d.appendChild(source);
}
$("results").appendChild(d);
});
}

const editorialSections = {
  events: {
    title: "What's Happening",
    intro: "Find Atlanta holiday pop-ups, live music and ideas for a night out. Use the venue and organizer links for tickets and hours.",
    groups: ["Holiday spotlight", "More nights out", "Holiday dates pending"],
    filters: ["Holiday", "Events", "Music", "Pop-ups", "Date nights", "Dates pending"]
  },
  openings: {
    title: "New & Coming Soon",
    intro: "Track Atlanta restaurant and bar debuts, announced openings, early leads and closure updates.",
    groups: ["Recently opened", "Coming soon", "Unconfirmed", "Closures & status"],
    filters: ["Recently opened", "Coming soon", "Unconfirmed", "Closures & status"]
  }
};
const atlantaDate = new Intl.DateTimeFormat("en-CA", {
  timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
});
function activeListings(section) {
  const today = atlantaDate.format(new Date());
  return listings.filter(item => item.section === section && item.expires >= today);
}
function filterOptions(id, label, values) {
  $(id).replaceChildren(new Option(label, ""), ...values.map(value => new Option(value, value)));
}
function renderEditorial() {
  const section = editorialSections[view];
  const category = $("listing-filter").value;
  const area = $("listing-area").value;
  const results = activeListings(view)
    .filter(item => (!category || item.tags.includes(category)) && (!area || item.area === area))
    .sort((a, b) => view === "events" ? a.start.localeCompare(b.start) : b.start.localeCompare(a.start));
  $("listing-count").textContent = results.length === 0
    ? "No current listings match these filters."
    : results.length + (results.length === 1 ? " listing" : " listings");
  const groups = section.groups.map(group => {
    const items = results.filter(item => {
      if (view === "openings") return item.tags.includes(group);
      if (item.tags.includes("Dates pending")) return group === "Holiday dates pending";
      return group === (item.tags.includes("Holiday") ? "Holiday spotlight" : "More nights out");
    });
    if (!items.length) return "";
    return '<section><h3>' + esc(group) + '</h3><div class="editorial-grid">' + items.map(item =>
      '<article class="editorial-card"><p class="listing-type">' + esc(item.tags.join(" · ")) +
      '</p><h4>' + esc(item.title) + '</h4><small>' + esc(item.date + " · " + item.area) +
      '</small><p>' + esc(item.description) + '</p><a href="' + esc(item.url) +
      '" target="_blank" rel="noopener noreferrer">' + esc(item.source) + ' ↗</a></article>'
    ).join("") + '</div></section>';
  });
  $("listing-groups").innerHTML = groups.join("");
}
for (const id of ["listing-filter", "listing-area"]) {
  $(id).addEventListener("change", renderEditorial);
}
document.querySelectorAll(".site-nav button").forEach(button => {
  button.addEventListener("click", () => {
    view = button.dataset.view;
    document.querySelectorAll(".site-nav button").forEach(tab => {
      const selected = tab === button;
      tab.classList.toggle("active", selected);
      tab.setAttribute("aria-pressed", selected);
    });
    const section = editorialSections[view];
    $("directory").hidden = Boolean(section);
    $("editorial").hidden = !section;
    if (!section) {
      render();
      return;
    }
    $("editorial-title").textContent = section.title;
    $("editorial-intro").textContent = section.intro;
    filterOptions("listing-filter", "All categories", section.filters);
    const areas = [...new Set(activeListings(view).map(item => item.area))].sort();
    filterOptions("listing-area", "All areas", areas);
    renderEditorial();
  });
});
["search","category","neighborhood","status","sort"].forEach(id=>$(id).addEventListener("input",render));
$("export").onclick=()=>{const names=places.filter(p=>favs.has(p.id)).map(p=>p.name+" — "+p.neighborhood).join("\n");const blob=new Blob([names||"No favorites yet"],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="atlanta-favorites.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
